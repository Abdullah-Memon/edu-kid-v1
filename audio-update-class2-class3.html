<!-- ENHANCED JAVASCRIPT FOR AUDIO WITH PAUSE -->
<!-- ============================================ -->

<script>
// Enhanced playVerse function with pause button support
function playVerse(poemId) {
    const manager = typeof class2Manager !== 'undefined' ? class2Manager : class3Manager;
    
    if (!manager.soundEnabled) return;
    
    const audioElement = document.getElementById(`audio-${poemId}`);
    const button = document.getElementById(`${poemId}-audio-btn`);
    
    if (!audioElement) {
        console.error(`Audio element not found for: ${poemId}`);
        return;
    }
    
    if (!button) {
        console.error(`Button not found for: ${poemId}`);
        return;
    }
    
    // Check if audio is already playing
    if (manager.currentAudio && manager.currentAudio.audioElement === audioElement && !audioElement.paused) {
        // Pause the audio
        pauseVerse(poemId);
        return;
    }
    
    // Stop any currently playing audio
    manager.stopCurrentAudio();
    
    const originalText = button.innerHTML;
    const card = button.closest('.poem-card') || button.closest('.glass-card');
    
    // Update button to show playing state with pause option
    button.innerHTML = `
        <span>پڙهي رهيو آهي ⏸</span>
    `;
    button.onclick = function() { pauseVerse(poemId); };
    
    // Add glow effect to the card
    if (card) {
        card.classList.add('glass-glow');
    }
    
    // Play the audio
    audioElement.currentTime = 0;
    audioElement.play().catch(error => {
        console.error('Error playing audio:', error);
        button.innerHTML = originalText;
        button.onclick = function() { playVerse(poemId); };
        if (card) {
            card.classList.remove('glass-glow');
        }
    });
    
    // Handle audio end
    audioElement.onended = function() {
        button.innerHTML = originalText;
        button.onclick = function() { playVerse(poemId); };
        if (card) {
            card.classList.remove('glass-glow');
        }
        manager.currentAudio = null;
        manager.updateProgress(`audio-${poemId}`);
    };
    
    manager.currentAudio = {
        button: button,
        originalText: originalText,
        card: card,
        audioElement: audioElement,
        poemId: poemId
    };
}

// New pause function
function pauseVerse(poemId) {
    const manager = typeof class2Manager !== 'undefined' ? class2Manager : class3Manager;
    
    if (!manager.currentAudio || manager.currentAudio.poemId !== poemId) return;
    
    const audioElement = manager.currentAudio.audioElement;
    const button = manager.currentAudio.button;
    const originalText = manager.currentAudio.originalText;
    const card = manager.currentAudio.card;
    
    // Pause the audio
    audioElement.pause();
    
    // Update button to show paused state
    button.innerHTML = `
        <span>روڪيل ▶️</span>
    `;
    button.onclick = function() { resumeVerse(poemId); };
    
    // Remove glow effect
    if (card) {
        card.classList.remove('glass-glow');
    }
}

// New resume function
function resumeVerse(poemId) {
    const manager = typeof class2Manager !== 'undefined' ? class2Manager : class3Manager;
    
    if (!manager.currentAudio || manager.currentAudio.poemId !== poemId) {
        playVerse(poemId);
        return;
    }
    
    const audioElement = manager.currentAudio.audioElement;
    const button = manager.currentAudio.button;
    const card = manager.currentAudio.card;
    
    // Resume the audio
    audioElement.play().catch(error => {
        console.error('Error resuming audio:', error);
        button.innerHTML = manager.currentAudio.originalText;
        button.onclick = function() { playVerse(poemId); };
    });
    
    // Update button to show playing state
    button.innerHTML = `
        <span>پڙهي رهيو آهي ⏸</span>
    `;
    button.onclick = function() { pauseVerse(poemId); };
    
    // Add glow effect
    if (card) {
        card.classList.add('glass-glow');
    }
}

// Update stopCurrentAudio to handle the new structure
if (typeof class2Manager !== 'undefined') {
    class2Manager.stopCurrentAudio = function() {
        if (this.currentAudio) {
            if (this.currentAudio.audioElement) {
                this.currentAudio.audioElement.pause();
                this.currentAudio.audioElement.currentTime = 0;
            }
            this.currentAudio.button.innerHTML = this.currentAudio.originalText;
            this.currentAudio.button.onclick = function() { 
                playVerse(this.currentAudio.poemId); 
            }.bind(this);
            if (this.currentAudio.card) {
                this.currentAudio.card.classList.remove('glass-glow');
            }
            this.currentAudio = null;
        }
    };
}

if (typeof class3Manager !== 'undefined') {
    class3Manager.stopCurrentAudio = function() {
        if (this.currentAudio) {
            if (this.currentAudio.audioElement) {
                this.currentAudio.audioElement.pause();
                this.currentAudio.audioElement.currentTime = 0;
            }
            this.currentAudio.button.innerHTML = this.currentAudio.originalText;
            this.currentAudio.button.onclick = function() { 
                playVerse(this.currentAudio.poemId); 
            }.bind(this);
            if (this.currentAudio.card) {
                this.currentAudio.card.classList.remove('glass-glow');
            }
            this.currentAudio = null;
        }
    };
}

// For Class 3 - playPoem function (if it uses different naming)
function playPoem(poemId, event) {
    if (event) event.stopPropagation();
    playVerse(poemId);
}
</script>
