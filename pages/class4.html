        /* Glass Morphism Effects */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);

        /* Advanced Animation System */

            50% { transform: translateY(-10px) rotateX(5deg); }

            50% { text-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 40px rgba(255,165,0,0.6); }
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes modalSlideIn {
            0% { 
                opacity: 0; 
                transform: scale(0.8) translateY(-50px) rotateX(-30deg); 
            }
            70% { 
                transform: scale(1.05) translateY(10px) rotateX(5deg); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1) translateY(0) rotateX(0deg); 
            }

        @keyframes verseHighlight {

            }

                transform: translateX(0) scale(1);
            }
        }

        @keyframes bounce-float {

            50% { transform: translateY(-15px) scale(1.05); }
        }
        
        @keyframes glass-glow {
            0% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }

        }
        
        @keyframes magical-entrance {
            0% { 
                opacity: 0; 
                transform: translateY(60px) scale(0.8) rotate(-5deg);
                filter: blur(5px);
            }
            50% { 
                opacity: 0.8; 
                transform: translateY(-10px) scale(1.05) rotate(2deg);
                filter: blur(1px);
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1) rotate(0deg);
                filter: blur(0px);
            }
        }
        
        @keyframes verse-shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        @keyframes letter-dance {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(-2deg); }
            50% { transform: translateY(-15px) rotate(0deg); }
            75% { transform: translateY(-10px) rotate(2deg); }
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes success-celebration {
            0% { transform: scale(1); }

            50% { transform: scale(1.05) rotate(-3deg); }
            75% { transform: scale(1.08) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Interactive Elements */
        .verse-line {
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #1f2937;
            font-weight: 500;
        }
        
        .verse-line:hover {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(236, 72, 153, 0.15));
            transform: translateX(15px) scale(1.02);
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.2);
        }
        
        .verse-line.reading {
            background: linear-gradient(135deg, rgba(255,215,0,0.4), rgba(255,165,0,0.4));
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            animation: verse-shimmer 2s linear infinite;
            background-size: 200% 100%;
        }
        
        /* Modal Enhancements */
        .modal-backdrop {
            backdrop-filter: blur(15px) brightness(0.7);
            background: rgba(0, 0, 0, 0.8);
        }
        
        .modal-content {
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            border-radius: 25px;
            box-shadow: 
                0 50px 100px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            animation: modalSlideIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* Enhanced Modal System for dark mode */
        body.dark .modal-backdrop {
            backdrop-filter: blur(20px) brightness(0.5);
            background: rgba(0, 0, 0, 0.9);
        }
        
        body.dark .modal-content {
            background: linear-gradient(135deg, #1e293b, #0f172a, #1e1b4b);
            box-shadow: 
                0 50px 100px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }
        
        /* Floating Elements */
        .floating-element {
            animation: cardFloat 4s ease-in-out infinite;
        }
        
        .floating-element:nth-child(2n) {
            animation-delay: 2s;
        }
        
        .floating-element:nth-child(3n) {
            animation-delay: 4s;
        }
        
        /* Header Effects */
        .hero-title {
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 300% 300%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease infinite, textGlow 3s ease-in-out infinite;
        }
        
        /* Progress System */
        .progress-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .progress-dot.active {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            border-color: #ffd700;
            transform: scale(1.4);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        
        /* Audio Visualization */
        .audio-wave {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: 8px;
        }
        
        .wave-bar {
            width: 4px;
            height: 20px;
            background: linear-gradient(to top, #667eea, #ffd700);
            border-radius: 2px;
            animation: waveAnimation 1.2s ease-in-out infinite;
        }
        
        .wave-bar:nth-child(1) { animation-delay: 0s; }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { animation-delay: 0.6s; }
        
        @keyframes waveAnimation {
            0%, 100% { height: 20px; opacity: 0.7; }
            50% { height: 35px; opacity: 1; }
        }
        
        /* Touch Ripple Effect */
        .touch-ripple {
            position: relative;
            overflow: hidden;
        }
        
        .touch-ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .touch-ripple:active::after {
            width: 300px;
            height: 300px;
        }
        
        @keyframes rippleAnimation {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }
        
        /* Enhanced Mobile Interactions */
        @media (hover: none) and (pointer: coarse) {
            .poetry-card:hover {
                transform: none;
            }
            
            .poetry-card:active {
                transform: scale(0.98);
            }
            
            .glass-button:hover {
                transform: none;
            }
            
            .glass-button:active {
                transform: scale(0.95);
            }
            
            .verse-line:hover {
                transform: none;
            }
            
            .verse-line:active {
                transform: scale(0.98);
            }
        }

        @keyframes confetti-fall {
            0% { 
                transform: translateY(-100vh) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% { 
                transform: translateY(100vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }
        
        @keyframes ripple-animation {

            }

            .glass-nav .text-xl {

            document.getElementById('darkModeIconHeader').textContent = '☀️';
        }

        // Setup nav hiding on scroll
        let lastScrollY = window.scrollY;
        let scrollTimeout;
        
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (nav) {
                if (window.scrollY > lastScrollY && window.scrollY > 100) {
                    // Scrolling down - hide nav
                    nav.style.transform = 'translateY(-100%)';
                } else {
                    // Scrolling up - show nav
                    nav.style.transform = 'translateY(0)';
                }
                lastScrollY = window.scrollY;
                
                // Clear previous timeout
                clearTimeout(scrollTimeout);
                
                // Set new timeout to hide nav after 3 seconds of no scrolling
                scrollTimeout = setTimeout(() => {
                    if (window.scrollY > 100) {
                        nav.style.transform = 'translateY(-100%)';
                    }
                }, 3000);

    </div>

    <!-- Poetry Modal -->
    <div id="poetryModal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4">
        <div class="modal-content max-w-4xl w-full max-h-[90vh] overflow-y-auto text-gray-800 relative">
            <button class="absolute top-6 right-6 text-gray-800 hover:text-red-600 text-3xl transition-all duration-300 touch-target" onclick="closeModal()">✕</button>
            <div class="text-center mb-8">
                <h2 id="modalTitle" class="text-4xl font-bold mb-4">شاعري</h2>
                <p id="modalAuthor" class="text-xl opacity-80">شاعر</p>
            </div>
            <div id="modalContent" class="text-xl leading-relaxed space-y-4">
                <!-- Content will be loaded here -->
            </div>
            <div class="text-center mt-8">
                <button onclick="closeModal()" class="expand-button px-6 py-3 rounded-full font-bold transition-all duration-300">
                    بند ڪريو
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="section bg-gradient-to-r from-blue-50 to-purple-50 text-center py-8 mt-12">
        <div class="container mx-auto px-4">
            <div class="text-2xl font-bold text-gray-800 mb-4">ڪلاس چوٿون - سنڌي بيت ۽ گيت</div>
            <p class="text-lg mb-2 text-gray-700">عبدالماجد ڀرگڙي انسٽيٽيوٽ آف لينگويج انجنيئرنگ</p>
            <p class="text-base text-gray-600">&copy; 2025 ثقافت کاتو، سنڌ حڪومت - سڀ حق محفوظ آهن</p>
            <div class="flex justify-center gap-4 mt-4">
                <span class="text-2xl">🌟</span>
                <span class="text-2xl">📖</span>
                <span class="text-2xl">🎭</span>
                <span class="text-2xl">✨</span>
            </div>
        </div>
    </footer>
    
    <style>
        /* Dark mode footer styles */
        body.dark footer {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.8));
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        body.dark footer .text-gray-800 {
            color: #e2e8f0 !important;
        }
        
        body.dark footer .text-gray-700 {
            color: #cbd5e1 !important;
        }
        
        body.dark footer .text-gray-600 {
            color: #94a3b8 !important;
        }
    </style>

    <!-- Audio elements will be created dynamically based on JSON data -->

    <script>
        // State Management Architecture
        class PoetryApp {
            constructor() {
                this.soundEnabled = true;
                this.currentAudio = null;
                this.progress = 0;
                this.completedItems = new Set();
                this.totalItems = 0;
                this.poetryData = [];
                this.init();
            }

            async init() {
                await this.loadPoetryData();
                this.initializeProgressDots();
                this.setAnimationDelays();
                this.bindEventHandlers();
                this.setupResponsiveFeatures();
            }

            async loadPoetryData() {
                try {
                    const response = await fetch('/assets/Data/classes/class4.json');
                    this.poetryData = await response.json();
                    this.totalItems = this.poetryData.length;
                    this.renderPoetryContent();
                } catch (error) {
                    console.error('Error loading poetry data:', error);
                    this.showError('خرابي: ڊيٽا لوڊ نه ٿي سگهيو');
                }
            }

            renderPoetryContent() {
                const container = document.getElementById('poetrySectionsContainer');
                if (!container) return;
                container.innerHTML = '';

                this.poetryData.forEach((item, index) => {
                    const section = this.createPoetrySection(item, index);
                    container.appendChild(section);
                });

                // Re-attach event listeners after dynamic content creation
                this.attachDynamicEventListeners();
            }

            createPoetrySection(item, index) {
                const section = document.createElement('section');
                section.className = 'section container mx-auto px-4 mb-12';
                
                const sectionType = this.getSectionType(item.baitTitle);
                const cardClass = this.getCardClass(sectionType);
                const audioId = `audio-${index}`;
                const icon = this.getSectionIcon(sectionType);
                
                section.innerHTML = `
                    <h2 class="text-4xl lg:text-5xl font-bold text-center text-gray-800 mb-8 drop-shadow-lg section-title">
                        ${this.getSectionTitle(sectionType)}
                    </h2>
                    
                    <div class="poetry-card glass-card ${cardClass} p-6 lg:p-12 rounded-3xl shadow-2xl max-w-5xl mx-auto mb-12 touch-ripple magical-entrance">
                        <div class="text-center mb-8">
                            <div class="text-7xl mb-6 floating-element">${icon}</div>
                            <h3 class="text-3xl lg:text-4xl font-bold mb-3 text-gray-800">${item.baitTitle}</h3>
                            <p class="text-xl opacity-90 text-gray-700">مصنف: ${item.author}</p>
                        </div>
                        
                        <div class="verses-container space-y-4 text-xl lg:text-2xl leading-relaxed text-center max-w-4xl mx-auto">
                            ${item.baitContent.map((line, lineIndex) => 
                                `<div class="verse-line cursor-pointer hover:bg-white hover:bg-opacity-20 p-3 rounded-lg transition-all duration-300" 
                                     onclick="highlightVerse(this)" 
                                     data-verse="${lineIndex}">
                                    ${line}
                                </div>`
                            ).join('')}
                        </div>
                        
                        <div class="text-center mt-8">
                            <button onclick="playPoetry('${audioId}')" class="glass-button expand-button px-8 py-4 rounded-full text-lg font-bold transition-all duration-300 touch-ripple">
                                <span id="${audioId}-btn">${sectionType === 'hamd' ? 'حمد ٻڌو' : sectionType === 'naat' ? 'نعت ٻڌو' : sectionType === 'nazm' ? 'نظم ٻڌو' : 'بيت ٻڌو'} 🎵</span>
                            </button>
                        </div>
                        
                        <audio id="${audioId}" src="${item.audioPath || ''}" preload="metadata"></audio>
                    </div>
                `;
                
                return section;
            }

            getSectionType(title) {
                if (title.includes('حمد')) return 'hamd';
                if (title.includes('نعت')) return 'naat';  
                if (title.includes('نظم')) return 'nazm';
                return 'bait';
            }

            getCardClass(type) {
                switch(type) {
                    case 'hamd': return 'hamd-card';
                    case 'naat': return 'hamd-card'; // Using same style as hamd
                    case 'nazm': return 'nazm-card';
                    default: return 'bait-card';
                }
            }

            getSectionTitle(type) {
                switch(type) {
                    case 'hamd': return '🌟 حمد 🌟';
                    case 'naat': return '☪️ نعت ☪️';
                    case 'nazm': return '🏛️ نظم 🏛️';
                    default: return '💎 بيت 💎';
                }
            }

            getSectionIcon(type) {
                switch(type) {
                    case 'hamd': return '🕌';
                    case 'naat': return '☪️';
                    case 'nazm': return '🏛️';
                    default: return '💎';
                }
            }

            attachDynamicEventListeners() {
                // Re-attach any event listeners that were lost during dynamic content creation
                const verseLines = document.querySelectorAll('.verse-line');
                verseLines.forEach(line => {
                    line.addEventListener('click', () => {
                        this.highlightVerse(line);
                    });
                });
            }

            playPoetry(audioId) {
                if (this.currentAudio && !this.currentAudio.paused) {
                    this.currentAudio.pause();
                }
                
                const audio = document.getElementById(audioId);
                if (audio && audio.src && audio.src !== window.location.href) {
                    this.currentAudio = audio;
                    audio.play().catch(error => {
                        console.error('Audio playback failed:', error);
                        this.showNotification('آڊيو چلائڻ ۾ مسئلو آهي');
                    });
                    this.showAudioVisualization();
                    this.markAsCompleted(audioId);
                } else {
                    this.showNotification('آڊيو دستياب نه آهي');
                }
            }

            highlightVerse(element) {
                // Remove previous highlights
                document.querySelectorAll('.verse-line.reading').forEach(el => {
                    el.classList.remove('reading');
                });
                
                // Add highlight to current verse
                element.classList.add('reading');
                
                // Add celebration effect
                this.createConfetti(element);
            }

            markAsCompleted(itemId) {
                this.completedItems.add(itemId);
                this.updateProgress();
                
                if (this.completedItems.size === this.totalItems) {
                    this.showAchievement('واڌايون!', 'توهان سڀ شعر مڪمل ڪيا!');
                }
            }

            updateProgress() {
                this.progress = (this.completedItems.size / this.totalItems) * 100;
                const progressText = document.getElementById('progressText');
                if (progressText) {
                    progressText.textContent = Math.round(this.progress) + '%';
                }
                this.updateProgressDots();
            }

            updateProgressDots() {
                const dots = document.querySelectorAll('.progress-dot');
                const completedCount = Math.floor((this.completedItems.size / this.totalItems) * dots.length);
                
                dots.forEach((dot, index) => {
                    if (index < completedCount) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }

            showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'glass-card p-6 text-center text-red-600 mb-6';
                errorDiv.innerHTML = `<h3 class="text-xl font-bold">${message}</h3>`;
                const container = document.getElementById('poetrySectionsContainer');
                if (container) container.appendChild(errorDiv);
            }

            showNotification(message) {
                // Create and show notification
                const notification = document.createElement('div');
                notification.className = 'fixed top-24 right-4 glass-card p-4 text-center z-50 text-gray-800';
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }

            showAchievement(title, message) {
                const modal = document.getElementById('achievementModal');
                const titleElement = document.getElementById('achievementTitle');
                const textElement = document.getElementById('achievementText');
                
                if (titleElement) titleElement.textContent = title;
                if (textElement) textElement.textContent = message;
                if (modal) modal.classList.remove('hidden');
            }

            showAudioVisualization() {
                // Add audio visualization effect
                const visualization = document.createElement('div');
                visualization.className = 'audio-wave fixed bottom-4 left-4 z-50';
                visualization.innerHTML = '<div class="wave-bar"></div>'.repeat(4);
                document.body.appendChild(visualization);
                
                setTimeout(() => {
                    visualization.remove();
                }, 3000);
            }

            createConfetti(element) {
                // Create confetti effect
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.cssText = `
                    position: absolute;
                    width: 10px;
                    height: 10px;
                    background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
                    animation: confetti-fall 1s ease-out forwards;
                    pointer-events: none;
                    top: 50%;
                    left: 50%;
                `;
                element.style.position = 'relative';
                element.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 1000);
            }

            setupResponsiveFeatures() {
                // Add viewport meta tag for better mobile experience
                let viewport = document.querySelector('meta[name="viewport"]');
                if (viewport) {
                    viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0');
                }
                
                // Handle orientation change
                window.addEventListener('orientationchange', () => {
                    setTimeout(() => {
                        this.recalculateLayout();
                    }, 500);
                });

                // Handle touch events for better mobile interaction
                this.bindTouchEvents();
            }

            bindTouchEvents() {
                // Improve touch feedback
                document.addEventListener('touchstart', (e) => {
                    if (e.target.classList.contains('verse-line') || e.target.classList.contains('poetry-card')) {
                        e.target.style.transform = 'scale(0.98)';
                    }
                });

                document.addEventListener('touchend', (e) => {
                    if (e.target.classList.contains('verse-line') || e.target.classList.contains('poetry-card')) {
                        setTimeout(() => {
                            e.target.style.transform = '';
                        }, 150);
                    }
                });
            }

            recalculateLayout() {
                // Recalculate any layout-dependent features
                const cards = document.querySelectorAll('.poetry-card');
                cards.forEach((card, index) => {
                    card.style.animationDelay = `${index * 0.2}s`;
                });
            }

            initializeProgressDots() {
                const container = document.getElementById('progressDots');
                if (container) {
                    container.innerHTML = '';
                    for (let i = 0; i < this.totalItems; i++) {
                        const dot = document.createElement('div');
                        dot.className = 'progress-dot w-3 h-3 rounded-full bg-gray-300 transition-all duration-300';
                        container.appendChild(dot);
                    }
                }
            }

            setAnimationDelays() {
                const cards = document.querySelectorAll('.poetry-card');
                cards.forEach((card, index) => {
                    card.style.animationDelay = `${index * 0.3}s`;
                });
            }

            bindEventHandlers() {
                // Dark mode toggle
                const darkModeToggle = document.getElementById('darkModeToggle');
                if (darkModeToggle) {
                    darkModeToggle.addEventListener('click', () => this.toggleDarkMode());
                }

                // Apply dark mode on initialization
                if (localStorage.getItem('darkMode') === 'enabled') {
                    document.body.classList.add('dark');
                }
            }

            toggleDarkMode() {
                const isDark = document.body.classList.toggle('dark');
                localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            }

            closeModal() {
                const modal = document.getElementById('poetryModal');
                if (modal) modal.classList.add('hidden');
            }

            closeAchievement() {
                const modal = document.getElementById('achievementModal');
                if (modal) modal.classList.add('hidden');
            }
        }

        // Initialize the application

        let poetryApp;

        document.addEventListener('DOMContentLoaded', () => {
            poetryApp = new PoetryApp();
        });

        // Global function exports for HTML onclick handlers
        function highlightVerse(element) {
            if (poetryApp) poetryApp.highlightVerse(element);
        }

        function playPoetry(audioId) {
            if (poetryApp) poetryApp.playPoetry(audioId);
        }

        function openPoetryModal(index) {
            if (poetryApp) poetryApp.openPoetryModal(index);
        }

        function playVerse(type) {
            if (poetryApp) poetryApp.playVerse(type);
        }

        function toggleDarkMode() {
            if (poetryApp) poetryApp.toggleDarkMode();
        }

        function toggleSound() {
            if (poetryApp) poetryApp.toggleSound();
        }
    </script>

    <!-- Audio elements are now created dynamically from JSON data -->
</body>
</html>
